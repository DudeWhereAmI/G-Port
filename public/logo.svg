<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Clip to inner circle -->
    <clipPath id="inner-globe-clip">
      <circle cx="250" cy="225" r="195" />
    </clipPath>
    
    <!-- Sky / Globe gradient -->
    <radialGradient id="globe-grad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E8F4FA" />
      <stop offset="100%" stop-color="#CFE7F4" />
    </radialGradient>

    <!-- Ocean base gradient -->
    <linearGradient id="ocean-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D92C1" />
      <stop offset="40%" stop-color="#2D7FA9" />
      <stop offset="100%" stop-color="#1B557A" />
    </linearGradient>

    <!-- Ship & G Fill gradient -->
    <linearGradient id="ship-g-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#246484" />
      <stop offset="60%" stop-color="#1E5470" />
      <stop offset="100%" stop-color="#17445C" />
    </linearGradient>

    <!-- Mint wave fill -->
    <linearGradient id="mint-wave-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B2EBD3" />
      <stop offset="100%" stop-color="#80D4B2" />
    </linearGradient>

    <!-- Green Leaf fill -->
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#68BE4B" />
      <stop offset="60%" stop-color="#4E9938" />
      <stop offset="100%" stop-color="#3B7D28" />
    </linearGradient>
  </defs>

  <!-- Outer Navy Circular Ring -->
  <circle cx="250" cy="225" r="218" fill="none" stroke="#16385C" stroke-width="26" />
  
  <!-- Inner White-Ice Globe Background -->
  <circle cx="250" cy="225" r="206" fill="url(#globe-grad)" />

  <!-- Globe / Ocean Elements inside Clip Path -->
  <g clip-path="url(#inner-globe-clip)">
    <!-- Globe Longitude & Latitude Grids (Top Half) -->
    <g stroke="#92BDD6" stroke-width="1.75" fill="none" opacity="0.85">
      <!-- Latitude Parallels -->
      <ellipse cx="250" cy="65" rx="120" ry="25" />
      <ellipse cx="250" cy="115" rx="165" ry="38" />
      <ellipse cx="250" cy="170" rx="190" ry="48" />
      <ellipse cx="250" cy="225" rx="195" ry="52" />
      
      <!-- Longitude Meridians -->
      <line x1="250" y1="30" x2="250" y2="420" />
      <path d="M 250 30 Q 185 225 250 420" />
      <path d="M 250 30 Q 315 225 250 420" />
      <path d="M 250 30 Q 120 225 250 420" />
      <path d="M 250 30 Q 380 225 250 420" />
      <path d="M 250 30 Q 60 225 250 420" />
      <path d="M 250 30 Q 440 225 250 420" />
    </g>

    <!-- Ocean Water Surface (Bottom Half) -->
    <rect x="40" y="248" width="420" height="180" fill="url(#ocean-grad)" />
    
    <!-- Water Ripple Patterns (Caustic reflections on water) -->
    <g fill="#5FBCE6" opacity="0.35">
      <ellipse cx="110" cy="275" rx="22" ry="7" />
      <ellipse cx="155" cy="268" rx="16" ry="5" />
      <ellipse cx="210" cy="280" rx="28" ry="8" />
      <ellipse cx="270" cy="270" rx="20" ry="6" />
      <ellipse cx="340" cy="275" rx="25" ry="7" />
      <ellipse cx="395" cy="282" rx="18" ry="6" />

      <ellipse cx="90" cy="305" rx="28" ry="9" />
      <ellipse cx="140" cy="320" rx="22" ry="8" />
      <ellipse cx="195" cy="310" rx="32" ry="10" />
      <ellipse cx="280" cy="325" rx="35" ry="11" />
      <ellipse cx="360" cy="315" rx="30" ry="9" />
      <ellipse cx="410" cy="325" rx="20" ry="7" />

      <ellipse cx="120" cy="360" rx="35" ry="12" />
      <ellipse cx="180" cy="375" rx="28" ry="10" />
      <ellipse cx="250" cy="380" rx="42" ry="13" />
      <ellipse cx="330" cy="370" rx="34" ry="11" />
      <ellipse cx="390" cy="380" rx="25" ry="9" />
    </g>

    <!-- Additional fine water caustics in lighter cyan -->
    <g fill="#A3E4FA" opacity="0.45">
      <path d="M 75 258 Q 95 252 115 258 Q 135 264 155 258 Q 175 252 195 258 Q 215 264 235 258 Q 255 252 275 258 Q 295 264 315 258 Q 335 252 355 258 Q 375 264 395 258 Q 415 252 435 258" stroke="#7ED2F5" stroke-width="2.5" fill="none" />
      <circle cx="160" cy="295" r="12" />
      <circle cx="230" cy="340" r="16" />
      <circle cx="310" cy="300" r="14" />
      <circle cx="370" cy="345" r="15" />
      <circle cx="130" cy="345" r="13" />
    </g>
  </g>

  <!-- Central Emblem: The "G" Ship Hull & Eco Leaf -->
  <g>
    <!-- Stylized G Outer Body & Cargo Vessel Hull -->
    <!-- Drawn as a continuous organic icon representing both the letter G and the container ship with cargo bow -->
    <path 
      d="M 285 105
         C 225 103 142 135 142 215
         C 142 300 205 348 290 348
         C 328 348 355 338 365 315
         L 365 240
         L 315 240
         L 315 265
         C 305 272 288 276 270 276
         C 220 276 195 245 195 215
         C 195 168 240 148 285 148
         C 305 148 322 152 335 160
         L 358 132
         C 338 116 314 105 285 105 Z"
      fill="url(#ship-g-grad)"
      stroke="#122F48"
      stroke-width="11"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Ship Cabin / Container Box on Deck -->
    <path
      d="M 314 202
         L 352 202
         L 352 225
         L 314 225 Z"
      fill="#1E5470"
      stroke="#122F48"
      stroke-width="9"
      stroke-linejoin="round"
    />
    <!-- Cabin Window / Cargo Accent -->
    <rect x="324" y="210" width="18" height="8" rx="2" fill="#8CE0C0" />

    <!-- Wave in Vessel Center / Inner G loop -->
    <path
      d="M 198 238
         C 205 230 216 230 224 238
         C 232 246 244 246 252 238
         C 260 230 272 230 280 238
         L 280 252
         C 272 260 260 260 252 252
         C 244 244 232 244 224 252
         C 216 260 205 260 198 252 Z"
      fill="url(#mint-wave-grad)"
      stroke="#122F48"
      stroke-width="7"
      stroke-linejoin="round"
    />

    <!-- Sprouting Green Eco Leaf & Stem -->
    <!-- Stem growing from ship deck curving up -->
    <path
      d="M 300 200
         C 300 170 315 150 338 135
         C 345 130 350 125 355 118"
      fill="none"
      stroke="#122F48"
      stroke-width="8"
      stroke-linecap="round"
    />

    <!-- Leaf Body -->
    <path
      d="M 336 138
         C 330 100 350 72 385 64
         C 392 95 382 130 350 146
         C 344 145 339 142 336 138 Z"
      fill="url(#leaf-grad)"
      stroke="#122F48"
      stroke-width="9"
      stroke-linejoin="round"
    />
    <!-- Leaf Center Vein -->
    <path
      d="M 342 136
         C 358 115 368 95 382 68"
      fill="none"
      stroke="#122F48"
      stroke-width="5"
      stroke-linecap="round"
    />
  </g>
</svg>
